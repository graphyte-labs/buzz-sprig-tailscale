name: build

# Block's buzz-sprig and Goose on our tailscale image. Builds on push and on
# demand, and daily when Block's main, our tailscale:latest or Goose's latest
# release has moved. Publishes only from master.
on:
  push:
    branches: [master]
    paths-ignore: ["**.md"]
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:
    inputs:
      sprig:
        description: Block tag, e.g. sha-8af2d91 (empty = main)
        required: false
      tailscale:
        description: Our tailscale tag, e.g. v1.102.5 (empty = our latest)
        required: false
      goose:
        description: Goose release, e.g. v1.53.0 (empty = latest)
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: build

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve versions
        id: v
        env:
          SPRIG: ${{ inputs.sprig }}
          TAILSCALE: ${{ inputs.tailscale }}
          GOOSE: ${{ inputs.goose }}
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          label() {
            docker buildx imagetools inspect "$1" --format '{{json .Image}}' \
              | jq -er --arg k "$2" '."linux/amd64".config.Labels[$k]'
          }
          d_sprig="sha-$(label ghcr.io/block/buzz-sprig:main org.opencontainers.image.revision | cut -c1-7)"
          d_tailscale="$(label "ghcr.io/$OWNER/tailscale:latest" org.opencontainers.image.version)"
          d_goose="$(gh release view -R aaif-goose/goose --json tagName -q .tagName)"
          sprig="${SPRIG:-$d_sprig}" tailscale="${TAILSCALE:-$d_tailscale}" goose="${GOOSE:-$d_goose}"
          [[ "$sprig" =~ ^sha-[0-9a-f]{7}$ && "$tailscale" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$goose" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          base="ghcr.io/$OWNER/tailscale:$tailscale"
          tags="$IMAGE:$sprig"
          # latest only when every version is the current default, however it was given.
          [ "$sprig $tailscale $goose" = "$d_sprig $d_tailscale $d_goose" ] && tags="$tags,$IMAGE:latest"
          # The tag only carries the sprig version; the tailscale base, Goose and
          # this repo's commit are recorded in labels, so any of them changing rebuilds.
          build=true
          if [ "$GITHUB_EVENT_NAME" = schedule ] \
            && [ "$(label "$IMAGE:$sprig" org.opencontainers.image.base.name 2>/dev/null)" = "$base" ] \
            && [ "$(label "$IMAGE:$sprig" org.opencontainers.image.revision 2>/dev/null)" = "$GITHUB_SHA" ] \
            && [ "$(label "$IMAGE:$sprig" io.github.aaif-goose.version 2>/dev/null)" = "$goose" ]; then
            build=false
            echo "$IMAGE:$sprig already published on $base"
          fi
          { echo "sprig=$sprig"; echo "tailscale=$tailscale"; echo "goose=$goose"; echo "base=$base"
            echo "tags=$tags"; echo "build=$build"; } >>"$GITHUB_OUTPUT"

      - name: Verify Goose
        id: goose
        if: steps.v.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GOOSE: ${{ steps.v.outputs.goose }}
        run: |
          set -euo pipefail
          for arch in x86_64 aarch64; do
            f="goose-$arch-unknown-linux-musl.tar.gz"
            gh release download "$GOOSE" -R aaif-goose/goose -p "$f" -D "$RUNNER_TEMP"
            gh attestation verify "$RUNNER_TEMP/$f" -R aaif-goose/goose >/dev/null
            echo "$arch=$(sha256sum "$RUNNER_TEMP/$f" | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
          done

      - if: steps.v.outputs.build == 'true'
        uses: docker/setup-qemu-action@v3
      - if: steps.v.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - if: steps.v.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          build-args: |
            SPRIG_VERSION=${{ steps.v.outputs.sprig }}
            TAILSCALE_VERSION=${{ steps.v.outputs.tailscale }}
            GOOSE_VERSION=${{ steps.v.outputs.goose }}
            GOOSE_SHA256_X86_64=${{ steps.goose.outputs.x86_64 }}
            GOOSE_SHA256_AARCH64=${{ steps.goose.outputs.aarch64 }}
          tags: ${{ steps.v.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.v.outputs.sprig }}
            org.opencontainers.image.base.name=${{ steps.v.outputs.base }}
            io.github.aaif-goose.version=${{ steps.v.outputs.goose }}
          push: true
